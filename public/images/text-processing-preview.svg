<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mgr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#0e1417"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0b1012"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Header -->
  <text x="32" y="42" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#60a5fa">// distributed text analysis</text>
  <text x="32" y="60" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#64737b">manager–worker · java · aws</text>

  <!-- Connectors -->
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.75" stroke-width="1.6">
    <!-- app -> sqs -> manager -->
    <path d="M162 250 H188" marker-end="url(#arr)"/>
    <path d="M270 250 H298" marker-end="url(#arr)"/>
    <!-- manager -> task queue -->
    <path d="M450 250 H476" marker-end="url(#arr)"/>
    <!-- task queue fan-out to workers -->
    <path d="M572 250 C588 250 586 134 598 134" marker-end="url(#arr)"/>
    <path d="M572 250 H598" marker-end="url(#arr)"/>
    <path d="M572 250 C588 250 586 366 598 366" marker-end="url(#arr)"/>
    <!-- manager -> report -->
    <path d="M375 190 V112 H164" marker-end="url(#arr)"/>
  </g>
  <!-- results back to manager -->
  <path d="M600 392 C520 392 500 318 452 300" fill="none" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arr)"/>
  <!-- S3 links -->
  <g fill="none" stroke="#22c55e" stroke-opacity="0.7" stroke-width="1.6">
    <path d="M375 312 V378" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
    <path d="M97 300 V412 H298" marker-end="url(#arrG)"/>
  </g>

  <!-- Connector labels -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#64737b">
    <text x="186" y="104">summary.html</text>
    <text x="108" y="404">upload input</text>
    <text x="478" y="340">results · SQS</text>
  </g>

  <!-- Report -->
  <g>
    <rect x="32" y="76" width="130" height="72" rx="12" fill="#0e1417" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="48" y="92" width="22" height="28" rx="3" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <path d="M53 101 H65 M53 106 H65 M53 111 H61" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="80" y="104" font-size="13" font-weight="600" fill="#f4f6f7">Report</text>
    <text x="80" y="120" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">HTML</text>
    <text x="48" y="138" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#64737b">aggregated output</text>
  </g>

  <!-- Local App -->
  <g>
    <rect x="32" y="200" width="130" height="100" rx="14" fill="#0e1417" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="48" y="216" width="30" height="20" rx="3" fill="none" stroke="#9ca9b0" stroke-width="1.5"/>
    <path d="M58 242 H68" stroke="#9ca9b0" stroke-width="1.5"/>
    <text x="48" y="266" font-size="15" font-weight="600" fill="#f4f6f7">Local App</text>
    <text x="48" y="284" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">input files</text>
  </g>

  <!-- SQS (app -> manager) -->
  <g>
    <rect x="190" y="232" width="80" height="36" rx="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="230" y="254.5" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#fbbf24">SQS</text>
  </g>

  <!-- Manager -->
  <g>
    <rect x="300" y="190" width="150" height="120" rx="16" fill="url(#mgr)" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="316" y="206" width="40" height="20" rx="6" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="336" y="220" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#60a5fa">EC2</text>
    <text x="316" y="256" font-size="18" font-weight="600" fill="#f4f6f7">Manager</text>
    <text x="316" y="276" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">split · dispatch</text>
    <text x="316" y="292" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">aggregate</text>
  </g>

  <!-- SQS tasks -->
  <g>
    <rect x="478" y="232" width="94" height="36" rx="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="525" y="254.5" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#fbbf24">SQS tasks</text>
  </g>

  <!-- Workers -->
  <g>
    <rect x="600" y="98" width="168" height="72" rx="14" fill="#0e1417" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="614" y="112" width="34" height="18" rx="5" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="631" y="125" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="9" font-weight="600" fill="#60a5fa">EC2</text>
    <text x="656" y="126" font-size="14" font-weight="600" fill="#f4f6f7">Worker 1</text>
    <text x="614" y="154" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">Stanford NLP</text>
  </g>
  <g>
    <rect x="600" y="214" width="168" height="72" rx="14" fill="#0e1417" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="614" y="228" width="34" height="18" rx="5" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="631" y="241" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="9" font-weight="600" fill="#60a5fa">EC2</text>
    <text x="656" y="242" font-size="14" font-weight="600" fill="#f4f6f7">Worker 2</text>
    <text x="614" y="270" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">Stanford NLP</text>
  </g>
  <g>
    <rect x="600" y="330" width="168" height="72" rx="14" fill="#0e1417" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="614" y="344" width="34" height="18" rx="5" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="631" y="357" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="9" font-weight="600" fill="#60a5fa">EC2</text>
    <text x="656" y="358" font-size="14" font-weight="600" fill="#f4f6f7">Worker N</text>
    <text x="614" y="386" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">Stanford NLP</text>
  </g>

  <!-- S3 -->
  <g>
    <rect x="300" y="380" width="150" height="64" rx="14" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.5"/>
    <ellipse cx="327" cy="402" rx="11" ry="4" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M316 402 V420 A11 4 0 0 0 338 420 V402" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="348" y="408" font-size="15" font-weight="600" fill="#f4f6f7">S3</text>
    <text x="348" y="425" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">inputs · results</text>
  </g>

  <!-- Legend -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#9ca9b0">
    <rect x="560" y="448" width="10" height="10" rx="2" fill="#60a5fa" fill-opacity="0.6"/>
    <text x="576" y="457">compute</text>
    <rect x="642" y="448" width="10" height="10" rx="2" fill="#f59e0b" fill-opacity="0.7"/>
    <text x="658" y="457">queue</text>
    <rect x="712" y="448" width="10" height="10" rx="2" fill="#22c55e" fill-opacity="0.7"/>
    <text x="728" y="457">storage</text>
  </g>
</svg>
